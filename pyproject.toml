[project]
name = "telegram-digest-langgraph"
version = "0.1.0"
description = "Daily Telegram chat digest generator using LangGraph and Telethon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0.6",
  "telethon>=1.36.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "tenacity>=9.1.2",
  "openai>=2.15.0",
]

[project.scripts]
tg-digest = "app.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.5.7",
  "pytest>=8.3.2",
  "mypy>=1.11.1",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
